<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ shared.title or "Shared circuit" }} — Qubit Sandbox</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<style>
  /* Deliberately minimal — no sidebar, topbar, or footer, matching
     embed-coin-flip.html / embed-two-qubit.html. Meant to be dropped
     into an <iframe> on someone else's blog/course page. */
  body{ background: var(--surface); padding: 18px; }
  .embed-wrap{ max-width: 560px; margin: 0 auto; }
  .embed-credit{ text-align: center; margin-top: 14px; font-size: 0.78rem; }
  .embed-credit a{ color: var(--text-faint); }
</style>
</head>
<body>

<div class="embed-wrap">
  <div class="panel">
    {% if shared.title %}<div class="panel-label">{{ shared.title.upper() }}</div>{% else %}<div class="panel-label">SHARED CIRCUIT</div>{% endif %}
    <pre class="code-block mono" style="font-size:0.78rem; margin-top:6px;">{{ shared.code }}</pre>
    <button class="primary block" id="run-btn" style="margin-top:12px;">Run on Qiskit Aer</button>
    <div class="mono muted" id="status" style="font-size:0.78rem; margin-top:8px;"></div>
    <div class="snippet-result" id="result"></div>
  </div>
  <div class="embed-credit">
    <a href="{{ url_for('view_shared_circuit', hash_=shared.hash) }}" target="_blank" rel="noopener">Qubit Sandbox — open in the full IDE →</a>
  </div>
</div>

<script>
  const code = {{ shared.code | tojson }};
  document.getElementById('run-btn').addEventListener('click', async () => {
    const btn = document.getElementById('run-btn');
    const statusEl = document.getElementById('status');
    const resultEl = document.getElementById('result');
    btn.disabled = true;
    statusEl.textContent = 'Calling qiskit-aer…';
    resultEl.textContent = '';
    try {
      const res = await fetch('/api/run-code', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code, shots: 1000 })
      });
      const data = await res.json();
      if (!res.ok) { statusEl.textContent = data.message || 'Could not run this circuit.'; return; }
      statusEl.textContent = `Ran on ${data.backend}.`;
      const entries = Object.entries(data.counts);
      const total = entries.reduce((sum, [, v]) => sum + v, 0) || 1;
      resultEl.innerHTML = entries.map(([k, v]) => `<span class="mono">'${k}': ${v}</span> (${(v/total*100).toFixed(1)}%)`).join(' &nbsp;·&nbsp; ');
    } catch (e) {
      statusEl.textContent = 'Could not reach the server.';
    } finally {
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
